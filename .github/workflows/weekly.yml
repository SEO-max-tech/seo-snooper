name: weekly-competitor-scan

# Sundays at 02:30 UTC. Trigger manually once with dry_run checked to lay
# the baseline and confirm credentials before letting the cron take over.
#
# The scan self-skips when SUPABASE_URL is missing, so a clone that has not
# been configured yet reports a green "not configured" run instead of a
# failure every week. Add the repository secrets to switch it on.
on:
  schedule:
    - cron: "30 2 * * 0"   # Sunday 02:30 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip webhooks and alert rows"
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::notice::No SUPABASE_URL secret — skipping the scan. See the README to configure this repository."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.configured == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache sentence-transformers model
        if: steps.check.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-l6-v2

      - run: pip install -r requirements.txt
        if: steps.check.outputs.configured == 'true'

      - name: Run scan
        if: steps.check.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          JUDGE_MODEL: claude-haiku-4-5
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
          # Set whichever webhooks you use — unset ones are skipped.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py ${{ inputs.dry_run && '--dry-run' || '' }}
